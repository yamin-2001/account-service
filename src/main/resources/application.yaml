server:
  port: 8081

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: account-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        # max.block.ms must be at least as long as delivery.timeout.ms, and
        # the publisher waits longer than both. Otherwise a publish can be
        # reported as failed while the message is still on its way, and the
        # retry sends it a second time.
        max.block.ms: 15000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5433/account_db
    username: ${DB_USERNAME:banking_admin}
    password: ${DB_PASSWORD:postgre2188}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  observability:
    log-bodies: true
    max-body-length: 2048
  cbs:
    # Eureka service name, resolved by the load balancer.
    base-url: http://core-banking-service
  account:
    max-per-user: 5
    default-currency: USD
    pending-timeout-minutes: 10
    # DEV ONLY: every new account starts with this balance so transfers can be tested.
    # Set ACCOUNT_DEMO_BALANCE=0 (or remove this) for anything real.
    demo-opening-balance: ${ACCOUNT_DEMO_BALANCE:0.00}
  messaging:
    producer-name: account-service
    relay-interval-ms: 1000
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
      tracing:
        endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  server:
    port: 18081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        api.calls: true
        kafka.consume: true
        client.calls: true

logging:
  structured:
    format:
      file: logstash
    json:
      add:
        service: ${spring.application.name}
  file:
    name: ${BANKING_LOG_DIR:${user.home}/banking-logs}/${spring.application.name}.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2500ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.banking.account.exception.DownstreamUnavailableException
          - com.banking.account.exception.DownstreamTimeoutException
          - com.banking.account.exception.DownstreamBadResponseException
        ignore-exceptions:
          - com.banking.account.exception.DownstreamRejectedException
    instances:
      cbs:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - com.banking.account.exception.DownstreamUnavailableException
          - com.banking.account.exception.DownstreamTimeoutException
        ignore-exceptions:
          - com.banking.account.exception.DownstreamRejectedException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      cbs-read:
        base-config: default