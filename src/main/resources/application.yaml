server:
  port: 8081

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: account-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        # max.block.ms must be at least as long as delivery.timeout.ms, and
        # the publisher waits longer than both. Otherwise a publish can be
        # reported as failed while the message is still on its way, and the
        # retry sends it a second time.
        max.block.ms: 15000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5433/account_db
    username: ${DB_USERNAME:banking_admin}
    password: ${DB_PASSWORD:postgre2188}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  cbs:
    # Eureka service name, resolved by the load balancer.
    base-url: http://core-banking-service
  account:
    max-per-user: 5
    default-currency: USD
    pending-timeout-minutes: 10
    # DEV ONLY: every new account starts with this balance so transfers can be tested.
    # Set ACCOUNT_DEMO_BALANCE=0 (or remove this) for anything real.
    demo-opening-balance: ${ACCOUNT_DEMO_BALANCE:0.00}
  messaging:
    producer-name: account-service
    relay-interval-ms: 1000
management:
  server:
    port: 18081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true